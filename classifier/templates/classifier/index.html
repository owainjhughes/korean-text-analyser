<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Korean Text Difficulty Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
        }

        form {
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            font-size: 1rem;
        }

        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
        }

        .word-list {
            list-style: none;
            padding: 0;
        }

        .word-list li {
            padding: 0.4rem 0;
        }

        .level-BEG {
            color: green;
        }

        .level-INT {
            color: orange;
        }

        .level-ADV {
            color: red;
        }

        .level-UNKNOWN {
            color: gray;
        }
    </style>
</head>
<body>
    <h1>Korean Text Difficulty Classifier</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="text">Enter Korean Text:</label><br>
        <textarea name="text" id="text" required>{{ result.text|default:'' }}</textarea><br>
        <button type="submit">Analyze</button>
    </form>

    {% if result.token_data %}
        <h2>Detected Words</h2>
        <ul class="word-list">
            {% for item in result.token_data %}
                <li class="level-{{ item.level|default:"UNKNOWN" }}">
                    <strong>{{ item.word }}</strong> —
                    {{ item.gloss }}
                    {% if item.level %}
                        <em>(Level: {{ item.level }})</em>
                    {% else %}
                        <em>(No level)</em>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
