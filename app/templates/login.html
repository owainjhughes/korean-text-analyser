{% extends "base.html" %}

{% block title %}Log in — Saebae{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-12">
  <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-gray-900">Log in</h1>
    <p class="mt-1 text-sm text-gray-600">Welcome back to Saebae.</p>

    {% if error %}
    <div class="mt-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="mt-6 space-y-4">
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-gray-300 p-2 text-sm text-gray-900 focus:border-[#55F] focus:outline-none">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-gray-300 p-2 text-sm text-gray-900 focus:border-[#55F] focus:outline-none">
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-[#55F] px-4 py-2 text-sm font-semibold text-white hover:bg-[#44E] transition-colors">
        Log in
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Don't have an account?
      <a href="/register?next={{ next | urlencode }}" class="font-medium text-[#55F] hover:underline">Register</a>
    </p>
  </div>
</section>
{% endblock %}
