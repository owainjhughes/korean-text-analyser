{% set p = request.url.path %}
<nav class="bg-white border-b border-gray-200">
  <div class="mx-auto max-w-6xl px-4">
    <div class="flex h-14 items-stretch gap-2">

      <div class="flex shrink-0 items-center">
        <span class="text-sm font-semibold text-gray-900 tracking-wide">Saebae</span>
      </div>

      <div class="hidden sm:ml-6 sm:flex sm:items-stretch">
        <div class="flex items-stretch gap-1">
          <a href="/"
             class="inline-flex items-center px-3 text-sm font-medium border-b-2 transition-colors {% if p == '/' %}border-[#55F] text-[#55F]{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
            Home
          </a>
          <a href="/analyze"
             class="inline-flex items-center px-3 text-sm font-medium border-b-2 transition-colors {% if p == '/analyze' %}border-[#55F] text-[#55F]{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
            Analyze
          </a>
          <a href="/dictionary"
             class="inline-flex items-center px-3 text-sm font-medium border-b-2 transition-colors {% if p.startswith('/dictionary') %}border-[#55F] text-[#55F]{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
            Dictionary
          </a>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- desktop flag switcher -->
      <div class="hidden sm:flex items-center gap-1.5 ml-3">
        <span class="ring-2 ring-[#55F] cursor-default inline-block rounded-sm overflow-hidden leading-none">
          <img src="/public/flag-kr.webp" alt="Korean" class="h-5 w-auto block">
        </span>
        <a href="https://obucon.com/"
           class="opacity-50 hover:opacity-100 transition-opacity inline-block rounded-sm overflow-hidden leading-none">
          <img src="/public/jp-flag.png" alt="Japanese" class="h-5 w-auto block">
        </a>
      </div>

      <!-- desktop auth state -->
      <div class="hidden sm:flex items-center gap-2 ml-4">
        {% if user %}
          <a href="/profile"
             class="inline-flex items-center px-3 text-sm font-medium border-b-2 transition-colors {% if p == '/profile' %}border-[#55F] text-[#55F]{% else %}border-transparent text-gray-700 hover:text-gray-900{% endif %}">
            Profile
          </a>
          <form method="POST" action="/logout" class="m-0">
            <button type="submit"
                    class="rounded-md border border-gray-300 px-3 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors">
              Log out
            </button>
          </form>
        {% else %}
          <a href="/login"
             class="text-sm font-medium text-gray-700 hover:text-gray-900 px-3">
            Log in
          </a>
          <a href="/register"
             class="rounded-md bg-[#55F] px-3 py-1.5 text-xs font-semibold text-white hover:bg-[#44E] transition-colors">
            Register
          </a>
        {% endif %}
      </div>

      <!-- mobile menu button -->
      <div class="flex items-center sm:hidden">
        <button type="button" id="mobile-menu-btn"
                aria-controls="mobile-menu" aria-expanded="false"
                class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:text-gray-500 hover:bg-gray-100 transition-colors">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- mobile disclosure panel -->
  <div id="mobile-menu" class="hidden sm:hidden border-t border-gray-200">

    <!-- flag switcher -->
    <div class="flex items-center gap-1.5 px-4 py-3">
      <span class="ring-2 ring-[#55F] cursor-default inline-block rounded-sm overflow-hidden leading-none">
        <img src="/public/flag-kr.webp" alt="Korean" class="h-5 w-auto block">
      </span>
      <a href="https://obucon.com/"
         class="opacity-50 hover:opacity-100 transition-opacity inline-block rounded-sm overflow-hidden leading-none">
        <img src="/public/jp-flag.png" alt="Japanese" class="h-5 w-auto block">
      </a>
    </div>

    <!-- nav links -->
    <div class="space-y-1 px-2 pb-3">
      <a href="/"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/' %}bg-[#55F]/10 text-[#55F]{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Home
      </a>
      <a href="/analyze"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/analyze' %}bg-[#55F]/10 text-[#55F]{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Analyze
      </a>
      <a href="/dictionary"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p.startswith('/dictionary') %}bg-[#55F]/10 text-[#55F]{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Dictionary
      </a>
      {% if user %}
        <a href="/profile"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/profile' %}bg-[#55F]/10 text-[#55F]{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
          Profile
        </a>
        <form method="POST" action="/logout" class="px-3 pt-1">
          <button type="submit"
                  class="block w-full rounded-md border border-gray-300 px-3 py-2 text-left text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            Log out
          </button>
        </form>
      {% else %}
        <a href="/login"
           class="block rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-900">
          Log in
        </a>
        <a href="/register"
           class="block rounded-md bg-[#55F]/10 px-3 py-2 text-sm font-medium text-[#55F]">
          Register
        </a>
      {% endif %}
    </div>

  </div>
</nav>

<script>
  (function () {
    var btn = document.getElementById('mobile-menu-btn');
    var menu = document.getElementById('mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', function () {
        var isHidden = menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', String(!isHidden));
      });
    }
  }());
</script>
