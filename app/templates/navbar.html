{% set p = request.url.path %}
<nav class="bg-white border-b border-gray-200">
  <div class="mx-auto max-w-6xl px-4">
    <div class="flex h-14 items-stretch gap-2">

      <div class="sm:hidden flex items-center">
        <button type="button" id="mobile-menu-btn"
                aria-controls="mobile-menu" aria-expanded="false"
                class="inline-flex items-center justify-center rounded p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

      <div class="flex flex-1 items-stretch">
        <a href="/" class="flex shrink-0 items-center">
          <img alt="Saebae" src="/public/android-chrome-192x192.png" class="h-7 w-auto" />
        </a>

        <div class="hidden sm:ml-6 sm:flex sm:items-stretch">
          <div class="flex items-stretch gap-1">
            <a href="/"
               class="border-b-2 inline-flex items-center px-3 text-sm font-medium transition-colors {% if p == '/' %}border-[#55F] text-[#55F] font-semibold{% else %}border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300{% endif %}">
              Home
            </a>
            <a href="/analyze"
               class="border-b-2 inline-flex items-center px-3 text-sm font-medium transition-colors {% if p == '/analyze' %}border-[#55F] text-[#55F] font-semibold{% else %}border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300{% endif %}">
              Analysis
            </a>
            <a href="/dictionary"
               class="border-b-2 inline-flex items-center px-3 text-sm font-medium transition-colors {% if p.startswith('/dictionary') %}border-[#55F] text-[#55F] font-semibold{% else %}border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300{% endif %}">
              Dictionary
            </a>
          </div>
        </div>
      </div>

      <div class="hidden sm:flex items-center gap-1.5 relative left-[-12px]">
        <a href="https://obucon.com/"
           class="rounded overflow-hidden opacity-50 hover:opacity-100 transition-opacity">
          <img src="/public/jp-flag.png" alt="Japanese" class="h-5 w-auto block">
        </a>
        <span class="rounded overflow-hidden ring-2 ring-[#55F] cursor-default">
          <img src="/public/flag-kr.webp" alt="Korean" class="h-5 w-auto block">
        </span>
      </div>

      <div class="hidden sm:flex items-center gap-2 sm:ml-6">
        {% if user %}
          <div class="relative">
            <button type="button" id="user-menu-btn"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu"
                    class="flex rounded-full focus:outline-none focus:ring-2 focus:ring-[#55F] focus:ring-offset-2">
              <span class="sr-only">Open user menu</span>
              <img src="/public/user.png" alt="User menu" class="size-8 rounded-full">
            </button>
            <div id="user-menu" role="menu" aria-labelledby="user-menu-btn"
                 class="hidden absolute right-0 z-20 mt-2 w-48 origin-top-right rounded-md border border-gray-200 bg-white py-1 shadow-lg focus:outline-none">
              <a href="/profile" role="menuitem"
                 class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                Your profile
              </a>
              <form method="POST" action="/logout" class="m-0">
                <button type="submit" role="menuitem"
                        class="block w-full text-left px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50">
                  Sign out
                </button>
              </form>
            </div>
          </div>
        {% else %}
          <a href="/login"
             class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
            Login
          </a>
          <a href="/register"
             class="rounded-full border border-[#55F] px-4 py-1.5 text-sm font-semibold text-[#55F] hover:bg-[#55F] hover:text-white transition-colors">
            Register
          </a>
        {% endif %}
      </div>

    </div>
  </div>

  <!-- mobile disclosure panel -->
  <div id="mobile-menu" class="hidden sm:hidden border-t border-gray-100">
    <div class="space-y-0.5 px-4 pb-3 pt-2">

      <!-- nav links -->
      <a href="/"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/' %}bg-indigo-50 text-[#55F] font-semibold{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Home
      </a>
      <a href="/analyze"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/analyze' %}bg-indigo-50 text-[#55F] font-semibold{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Analysis
      </a>
      <a href="/dictionary"
         class="block rounded-md px-3 py-2 text-sm font-medium {% if p.startswith('/dictionary') %}bg-indigo-50 text-[#55F] font-semibold{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}">
        Dictionary
      </a>

      <!-- flag switcher -->
      <div class="flex items-center gap-1.5 px-3 py-2">
        <a href="https://obucon.com/"
           class="rounded overflow-hidden opacity-50 hover:opacity-100 transition-opacity">
          <img src="/public/jp-flag.png" alt="Japanese" class="h-5 w-auto block">
        </a>
        <span class="rounded overflow-hidden ring-2 ring-[#55F] cursor-default">
          <img src="/public/flag-kr.webp" alt="Korean" class="h-5 w-auto block">
        </span>
      </div>

      <!-- auth -->
      {% if user %}
        <a href="/profile"
           class="block rounded-md px-3 py-2 text-sm font-medium {% if p == '/profile' %}bg-indigo-50 text-[#55F] font-semibold{% else %}text-gray-600 hover:bg-gray-50 hover:text-gray-900{% endif %}">
          Profile
        </a>
        <form method="POST" action="/logout">
          <button type="submit"
                  class="block w-full text-left rounded-md px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50">
            Sign out
          </button>
        </form>
      {% else %}
        <a href="/login"
           class="block rounded-md px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900">
          Login
        </a>
        <a href="/register"
           class="block rounded-md px-3 py-2 text-sm font-semibold text-[#55F] hover:bg-indigo-50">
          Register
        </a>
      {% endif %}

    </div>
  </div>
</nav>

<script>
  (function () {
    var btn = document.getElementById('mobile-menu-btn');
    var menu = document.getElementById('mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', function () {
        var isHidden = menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', String(!isHidden));
      });
    }

    var userBtn = document.getElementById('user-menu-btn');
    var userMenu = document.getElementById('user-menu');
    if (userBtn && userMenu) {
      var closeUserMenu = function () {
        userMenu.classList.add('hidden');
        userBtn.setAttribute('aria-expanded', 'false');
      };
      userBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var isHidden = userMenu.classList.toggle('hidden');
        userBtn.setAttribute('aria-expanded', String(!isHidden));
      });
      document.addEventListener('click', function (e) {
        if (!userMenu.classList.contains('hidden') && !userMenu.contains(e.target) && e.target !== userBtn) {
          closeUserMenu();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeUserMenu();
      });
    }
  }());
</script>
